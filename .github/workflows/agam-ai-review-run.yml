name: Agam AI review (run)

# Runs PX4's AI review (Tools/ci/ai_review from main, unmodified) on one PR
# and posts the result. Called by agam-pr-checks.yml (automatic, lighter
# model) and agam-ai-review.yml (the !ai-review command).
#
# Differences from PX4's pr-ai-review.yml, all forced by this fork:
# - GitHub-hosted runners instead of RunsOn.
# - Anthropic instead of Bedrock, through .github/agam/bin/claude: a Claude
#   subscription token (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`),
#   which needs --safe-mode in place of PX4's --bare, or an API key. Both
#   are secrets of the ai-review environment, which only workflows running
#   from agam-ci may use, so a workflow pushed on another branch cannot
#   read them.
# - No sandbox for model-written code, so no gVisor hardening step. The
#   reviewer keeps PX4's read-only tools (Read, grep, ls, git log/blame/show).
# - Posting happens here instead of in pr-review-poster.yml.

on:
  workflow_call:
    inputs:
      pr:
        type: number
        required: true
      model:
        type: string
        default: default
      effort:
        type: string
        default: default
      validator_model:
        type: string
        default: ''
      validator_effort:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    environment: ai-review
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: agam-ai-review-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - name: Checkout Agam CI
        uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
          sparse-checkout: .github/agam

      # Trusted prompts, criteria and tooling, from main: an upstream
      # mirror that only maintainers can update in this fork.
      - name: Checkout PX4 review tooling from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: base
          persist-credentials: false
          sparse-checkout: |
            AGENTS.md
            .agents/skills/review-pr
            .github/instructions
            .github/workflows/pr-ai-review.yml
            Tools/ci
          sparse-checkout-cone-mode: false

      # The PR as data for the reviewer to read. Never built or run.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          path: pr
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # Says what is wrong with a stored credential without printing it.
      - name: Check the credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          token=$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')
          key=$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')
          if [ -n "$token" ]; then
            case "$token" in
              sk-ant-oat*) echo "Subscription token: ${#token} characters" ;;
              *) echo "::warning::CLAUDE_CODE_OAUTH_TOKEN (${#token} characters) does not start with sk-ant-oat. Store only the token that claude setup-token prints." ;;
            esac
          elif [ -n "$key" ]; then
            case "$key" in
              sk-ant-api*) echo "API key: ${#key} characters" ;;
              *) echo "::warning::ANTHROPIC_API_KEY (${#key} characters) does not start with sk-ant-api." ;;
            esac
          else
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in the ai-review environment."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # PX4's pinned version, or 2.1.318 if that is newer: the first one
      # known to have --safe-mode, which subscription auth needs.
      - name: Install Claude Code
        run: |
          px4=$(sed -n 's/^ *CLAUDE_CODE_VERSION: *//p' base/.github/workflows/pr-ai-review.yml | head -1)
          if [ -z "$px4" ]; then
            echo "::error::CLAUDE_CODE_VERSION not found in PX4's pr-ai-review.yml"
            exit 1
          fi
          version=$(printf '%s\n' "$px4" 2.1.318 | sort -V | tail -1)
          npm install -g "@anthropic-ai/claude-code@${version}"
          if ! claude --help | grep -q -- --safe-mode; then
            echo "::error::Claude Code ${version} has no --safe-mode"
            exit 1
          fi
          echo "REAL_CLAUDE=$(command -v claude)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ci/.github/agam/bin" >> "$GITHUB_PATH"

      - name: Run review
        working-directory: base/Tools/ci
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          VALIDATOR_MODEL: ${{ inputs.validator_model }}
          VALIDATOR_EFFORT: ${{ inputs.validator_effort }}
        run: |
          extra=()
          if [ -n "$VALIDATOR_MODEL" ]; then extra+=(--validator-model "$VALIDATOR_MODEL"); fi
          if [ -n "$VALIDATOR_EFFORT" ]; then extra+=(--validator-effort "$VALIDATOR_EFFORT"); fi
          python3 -m ai_review run --pr "$PR_NUMBER" --model "$MODEL" \
            --effort "$EFFORT" "${extra[@]}" \
            --trusted-root "$GITHUB_WORKSPACE/base" \
            --checkout "$GITHUB_WORKSPACE/pr" \
            --work-dir "$GITHUB_WORKSPACE/ai-review-work" \
            --out-dir "$GITHUB_WORKSPACE/pr-review"

      # PX4's tool screens its output for the AWS and GitHub credentials it
      # knows about; this fork's credentials are these two.
      - name: Screen the output for the credentials
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for secret in "$CLAUDE_CODE_OAUTH_TOKEN" "$ANTHROPIC_API_KEY"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" \
                pr-review ai-review-work "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
              rm -rf pr-review ai-review-work
              : > "$GITHUB_STEP_SUMMARY"
              echo "::error::Review output contained a credential; nothing will be posted."
              exit 1
            fi
          done

      - name: Upload pr-review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-review
          path: |
            pr-review/manifest.json
            pr-review/comments.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-report
          path: |
            ai-review-work/findings.json
            ai-review-work/report.md
            ai-review-work/usage.json
            pr-review/manifest.json
            pr-review/comments.json
          if-no-files-found: ignore
          retention-days: 30

  post:
    name: Post
    needs: review
    if: always() && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PX4 review poster from main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            Tools/ci/pr-review-poster.py
            Tools/ci/_github_helpers.py
          sparse-checkout-cone-mode: false

      - name: Download pr-review artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-review
          path: pr-review

      - name: Post the review
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/ci/pr-review-poster.py validate pr-review
          python3 Tools/ci/pr-review-poster.py post pr-review
